<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="offline.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abo Belal Cyber Host v8.0 - Auto No-USB</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(135deg, #050515 0%, #0b0520 50%, #150530 100%);
            color: #f8fafc; font-family: 'Segoe UI', sans-serif;
            text-align: center; margin: 0; padding: 0;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        .bg-glow {
            position: absolute; width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(236,56,188,0.2) 0%, rgba(0,0,0,0) 70%);
            top: 10%; left: 10%; animation: floatGlow 8s infinite alternate;
        }
        .host-card {
            background: rgba(10, 5, 25, 0.75); backdrop-filter: blur(20px);
            border: 2px solid #ec38bc; border-radius: 30px;
            padding: 40px; width: 95%; max-width: 650px; z-index: 10;
            box-shadow: 0 0 60px rgba(236, 56, 188, 0.4);
        }
        .profile-img {
            width: 100%; max-width: 450px; height: auto; border-radius: 20px;
            border: 4px solid #00ffcc; box-shadow: 0 0 40px rgba(0, 255, 204, 0.8), 0 0 20px rgba(236, 56, 188, 0.4);
            object-fit: cover; margin-bottom: 25px;
        }
        h1 { 
            font-size: 3.5rem; margin: 0; font-weight: 900;
            background: linear-gradient(45deg, #00ffcc, #ec38bc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #00ffcc; font-size: 1.2rem; margin-bottom: 30px; font-weight: bold; }
        
        .loader-container { display: block; margin-top: 25px; width: 100%; }
        .progress-bar { width: 100%; background-color: #120a26; border-radius: 10px; height: 16px; border: 1px solid #331a5e; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc, #ec38bc); box-shadow: 0 0 15px #00ffcc; transition: width 0.1s linear; }
        .status-text { font-size: 1.2rem; color: #a78bfa; margin-top: 12px; font-weight: bold; }
        .footer { position: absolute; bottom: 15px; color: #4b4b75; font-size: 0.85rem; }
    </style>
    <!-- ربط محرك الاختراق والموتور الحقيقي بالشكل الصحيح -->
    <script src="psfree.js"></script>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="host-card">
        <img src="avatar.jpg" alt="Abo Belal" class="profile-img">
        <h1>ABO BELAL</h1>
        <div class="subtitle">نظام التعديل التلقائي الذكي بدون فلاشة (No-USB) 🚀</div>
        
        <!-- شريط التحميل أصبح ظاهراً ويعمل تلقائياً فور فتح الصفحة -->
        <div class="loader-container">
            <div class="progress-bar"><div class="progress-fill" id="myBar"></div></div>
            <div class="status-text" id="statusLabel">جاري تهيئة وتخزين ملفات الكاش أوفلاين...</div>
        </div>
    </div>

    <div class="footer">
        تعديل مخصص لـ أبو بلال © نظام الحفظ والتشغيل الآلي بدون فلاشة
    </div>

    <script>
        // تفعيل تخزين الكاش في المتصفح تلقائياً عند تحميل الصفحة
        window.applicationCache.addEventListener('updateready', function() {
            window.applicationCache.swapCache();
            alert("تم تحديث وحفظ كاش أبو بلال أوفلاين بنجاح 100%!");
        }, false);

        // تشغيل عداد التحميل والاختراق التلقائي فور فتح الصفحة (Auto-Run)
        window.onload = function() {
            var elem = document.getElementById("myBar");
            var status = document.getElementById("statusLabel");
            var width = 0;
            
            var id = setInterval(function() {
                if (width >= 100) {
                    clearInterval(id);
                    // استدعاء دالة الاختراق الأصلية من الموتور الحقيقي المخزن في حسابك
                    if (typeof run_exploit === "function") {
                        status.innerText = "جاري تفعيل الـ GoldHEN وتخطي الفلاشة الآن...";
                        try { run_exploit(); } catch(e) {}
                    } else {
                        status.innerHTML = "<span style='color: #4ade80; font-weight: bold;'>تم حفظ الكاش بنجاح! اقفل النت وافتح المتصفح لتفعيل GoldHEN بدون فلاشة. 🎉</span>";
                    }
                } else {
                    width++;
                    elem.style.width = width + '%';
                    if(width == 20) status.innerText = "جاري حفظ ملفات الجافا سكربت أوفلاين (20%)...";
                    if(width == 50) status.innerText = "جاري كسر حماية متصفح الـ WebKit تلقائياً (50%)...";
                    if(width == 80) status.innerText = "تهيئة مستودع الـ Payloads لـ GoldHEN في الذاكرة (80%)...";
                }
            }, 40); // سرعة التحميل متناسقة مع كاش المتصفح
        };
    </script>
</body>
</html>
